[package]
name = "rust_lib_origin_lens"
version = "0.1.0"
edition = "2021"

[lib]
# rlib is additional, not a replacement: cdylib and staticlib are still
# produced for the Flutter build. It exists so integration tests under
# tests/ can link against this crate.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
# fetch_remote_manifests is deliberately absent. With that feature, a missing
# embedded manifest makes Store::load_jumbf_from_stream fetch the
# dcterms:provenance URL out of the image's XMP from inside
# Reader::from_stream, before any code in this crate regains control and long
# before the user could be asked. Without it, the same code path returns
# Error::RemoteManifestUrl carrying the URL, which this crate turns into a
# reportable state. The fetch then happens only in fetch_remote_manifest, on an
# explicit call, under this crate's own scheme, timeout and size rules.
c2pa = { version = "0.32", features = ["unstable_api"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
thiserror = "1.0"
kamadak-exif = "0.5"
# Used only by the consented remote-manifest fetch. c2pa links the same crate
# on non-wasm targets, so this adds no new code to the binary.
ureq = "2.12"
# Scheme inspection for the same path, so an http URL can be named in the
# rejection message rather than merely failing a prefix test.
url = "2"

[profile.release]
lto = true
opt-level = "z"
strip = true
