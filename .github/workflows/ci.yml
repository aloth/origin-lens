name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust_builder/rust/target
          key: cargo-${{ hashFiles('src/rust_builder/rust/Cargo.lock') }}

      # The fixtures are vendored, so these tests do not reach the network.
      - name: Test
        working-directory: src/rust_builder/rust
        run: cargo test --verbose

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned so an analyzer or framework release cannot change the result of
      # an unchanged commit. Matches the version the release builds use.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      # Restricted to lib/: the tree also contains rust_builder/cargokit, a
      # vendored build tool that is its own Dart package with its own
      # dependencies. Analysing it here reports errors for imports that were
      # never resolved in this workspace, which says nothing about this app.
      # Warnings and lints are reported but do not fail the build; only real
      # analyzer errors in application code do.
      - name: Analyze
        working-directory: src
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      # Pure Dart and widget tests. They do not load the Rust library, so no
      # native build is needed. src/.env is gitignored but listed as an asset,
      # so an empty one is created for the asset bundle to resolve.
      - name: Test
        working-directory: src
        run: |
          touch .env
          flutter test
